<style>
  /* ==========================
     🎨 SIDEBAR - BASE
  ========================== */
  .main_box {
    width: 100%;
    height: 100%;
  }

  .sidebar_menu {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 12px;
    box-sizing: border-box;
    background: var(--op-surface, #ffffff);
    color: var(--op-ink, #202a37);
    border-right: 1px solid var(--op-border, #e3e7ee);
    box-shadow: 2px 0 16px rgba(15, 23, 42, 0.05);
    overflow: hidden;
  }

  #check {
    display: none;
  }

  /* ==========================
     🔷 LOGO
  ========================== */
  .sidebar_menu .logo {
    margin-bottom: 14px;
    padding: 2px 4px 10px 4px;
    border-bottom: 1px solid var(--op-border, #e3e7ee);
  }

  .sidebar_menu .logo a {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--op-ink, #202a37);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .sidebar_menu .logo a i {
    font-size: 17px;
  }

  .sidebar_menu .logo a span {
    display: inline-block;
    white-space: nowrap;
  }

  /* ==========================
     📋 MENU PRINCIPAL
  ========================== */
  .sidebar_menu .menu {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-right: 2px;
    margin-top: 4px;
  }

  .sidebar_menu .menu::-webkit-scrollbar {
    width: 6px;
  }

  .sidebar_menu .menu::-webkit-scrollbar-thumb {
    background: var(--op-border, #e3e7ee);
    border-radius: 10px;
  }

  .sidebar_menu .menu ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .sidebar_menu .menu-item,
  .sidebar_menu .menu ul li {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 8px 11px;
    margin: 2px 0;
    border-radius: 11px;
    cursor: pointer;
    user-select: none;
    transition:
      background 0.2s ease,
      transform 0.16s ease,
      box-shadow 0.2s ease,
      color 0.2s ease;
    color: var(--op-ink-soft, #5b6472);
  }

  .sidebar_menu .menu-item:hover,
  .sidebar_menu .menu ul li:hover {
    background: var(--op-surface-2, #f5f7fa);
    transform: translateX(2px);
    box-shadow: inset 0 0 0 1px var(--op-border, #e3e7ee);
  }

  .sidebar_menu .menu-item i,
  .sidebar_menu .menu ul li i {
    width: 17px;
    min-width: 17px;
    text-align: center;
    font-size: 14px;
  }

  .sidebar_menu .menu-item span,
  .sidebar_menu .menu ul li span {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.2;
    color: inherit;
  }

  /* ==========================
     🎨 ÍCONES PRINCIPAIS
     Tons suavizados (mistura ~35% branco sobre a cor original) — mesmas
     cores de base, só menos saturadas/"gritantes" no menu escuro.
  ========================== */
  .icon-dashboard {
    color: #2e7d32 !important;
  }

  .icon-analises {
    color: #b8860b !important;
  }

  .icon-comparativos {
    color: #9333ea !important;
  }

  .icon-config {
    color: #64748b !important;
  }

  /* ==========================
     👑 PAINEL DE OURO
  ========================== */
  .menu-item.menu-painel-ouro {
    position: relative;
    background: linear-gradient(
      90deg,
      rgba(212, 175, 55, 0.1),
      rgba(255, 215, 0, 0.06)
    );
    border: 1px solid rgba(212, 175, 55, 0.22);
  }

  .menu-item.menu-painel-ouro:hover {
    background: linear-gradient(
      90deg,
      rgba(212, 175, 55, 0.18),
      rgba(255, 215, 0, 0.1)
    );
    border-color: rgba(244, 197, 66, 0.34);
    box-shadow:
      0 8px 20px rgba(212, 175, 55, 0.1),
      inset 0 0 0 1px rgba(255, 215, 0, 0.06);
  }

  .icon-painel-ouro {
    color: #d4af37 !important;
    filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.24));
  }

  .menu-item.menu-painel-ouro span {
    color: #8a6512;
    font-weight: 700;
  }

  .menu-item.menu-painel-ouro::after {
    content: "Premium";
    margin-left: auto;
    font-size: 9px;
    font-weight: 700;
    color: #3e2f00;
    background: linear-gradient(180deg, #f4d35e 0%, #d4af37 100%);
    padding: 3px 8px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(212, 175, 55, 0.18);
  }

  /* ==========================
     🏷️ RÓTULO DE SEÇÃO
     Separa visualmente a navegação principal (Análises, Painel de Ouro,
     Comparativos) do grupo de classes de indicadores logo abaixo.
  ========================== */
  .menu-secao-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 6px 6px;
    padding-top: 12px;
    border-top: 1px solid var(--op-border, #e3e7ee);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--op-ink-muted, #8891a0);
  }

  /* ==========================
     🔥 CLASSES (grupos de indicadores)
  ========================== */
  .menu-classe {
    font-weight: 700;
    border: 1px solid transparent;
  }

  .menu-classe-caret {
    margin-left: auto;
    font-size: 11px !important;
    width: auto !important;
    min-width: 0 !important;
    color: var(--op-ink-muted, #8891a0);
    transition: transform 0.2s ease;
  }

  .menu-classe.ativo {
    background: var(--op-surface-2, #f5f7fa);
    border-color: var(--op-border, #e3e7ee);
  }

  .menu-classe.ativo .menu-classe-caret {
    transform: rotate(90deg);
    color: var(--op-accent, #2f6fe0);
  }

  /* ==========================
     🔸 INDICADORES (subgrupo, dentro de cada classe)
  ========================== */
  .submenu {
    display: none;
    margin: 2px 0 8px 0;
    padding: 0;
    list-style: none;
    border-left: 2px solid var(--op-border, #e3e7ee);
    margin-left: 20px;
    padding-left: 8px;
  }

  .submenu .submenu-item,
  .submenu li {
    position: relative;
    display: flex;
    align-items: center;
    padding: 7px 10px 7px 22px;
    margin: 2px 0;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 500;
    color: var(--op-ink-muted, #8891a0);
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .submenu .submenu-item::before,
  .submenu li::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--op-ink-muted, #8891a0);
    opacity: 0.7;
    transition: background 0.2s ease, opacity 0.2s ease;
  }

  .submenu .submenu-item:hover,
  .submenu li:hover {
    background: var(--op-accent-soft, #eaf0fe);
    color: var(--op-accent, #2f6fe0);
  }

  .submenu .submenu-item:hover::before,
  .submenu li:hover::before {
    background: var(--op-accent, #2f6fe0);
    opacity: 1;
  }

  .submenu.ativo {
    display: block;
  }

  /* ==========================
     🔻 RODAPÉ
  ========================== */
  .bottom-area {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--op-border, #e3e7ee);
  }

  /* ==========================
     ⚙️ CONFIGURAÇÕES
  ========================== */
  .config-btn {
    margin-bottom: 12px;
    border-radius: 12px;
    cursor: pointer;
    transition:
      background 0.2s ease,
      transform 0.16s ease;
  }

  .config-btn:hover {
    background: var(--op-surface-2, #f5f7fa);
    transform: translateX(2px);
  }

  .config-btn-content {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 42px;
    padding: 10px 12px;
  }

  .config-btn-content span {
    font-size: 13px;
    font-weight: 600;
    color: var(--op-ink, #202a37);
  }

  /* ==========================
     👤 USUÁRIO (card compacto)
  ========================== */
  .user-footer {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  .user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    background: var(--op-surface-2, #f5f7fa);
    border: 1px solid var(--op-border, #e3e7ee);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
  }

  .avatar {
    width: 50px;
    height: 50px;
    min-width: 50px;
    border-radius: 14px;
    border: none;
    padding: 0;
    background: linear-gradient(135deg, var(--op-accent-2, #5b93f5) 0%, var(--op-accent, #2f6fe0) 100%);
    background-size: cover;
    background-position: center;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(47, 111, 224, 0.3);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }
  .avatar:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(47, 111, 224, 0.34);
  }
  .avatar.tem-foto { color: transparent; }

  .user-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .user-nome {
    color: var(--op-ink, #202a37);
    font-weight: 700;
    font-size: 14px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-funcao {
    color: var(--op-ink-muted, #8891a0);
    font-weight: 500;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ==========================
     🪟 POPOVER DE PERFIL (transparente)
  ========================== */
  .perfil-popover {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    margin-bottom: 10px;
    z-index: 50;
    padding: 14px;
    border-radius: 16px;
    background: var(--op-surface, #ffffff);
    border: 1px solid var(--op-border, #e3e7ee);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
    animation: popIn 0.16s ease;
  }
  .perfil-popover[hidden] { display: none; }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .perfil-pop-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar-pop {
    width: 56px; height: 56px; min-width: 56px;
    cursor: default;
    font-size: 19px;
  }
  .avatar-pop:hover { transform: none; }
  .perfil-pop-acoes { display: flex; flex-direction: column; gap: 6px; }
  .pop-btn {
    border: 1px solid var(--op-border, #e3e7ee);
    background: var(--op-surface-2, #f5f7fa);
    color: var(--op-ink, #202a37);
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .pop-btn:hover { background: var(--op-accent-soft, #eaf0fe); }
  .pop-btn-ghost { background: transparent; color: #be123c; border-color: rgba(251,113,133,0.4); }
  .perfil-pop-dados { display: flex; flex-direction: column; gap: 7px; }
  .pop-linha {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    border-bottom: 1px solid var(--op-border, #e3e7ee);
    padding-bottom: 6px;
  }
  .pop-linha:last-child { border-bottom: none; padding-bottom: 0; }
  .pop-linha span { color: var(--op-ink-muted, #8891a0); font-weight: 600; }
  .pop-linha b { color: var(--op-ink, #202a37); font-weight: 700; text-align: right; word-break: break-word; }

  /* ==========================
     📱 RESPONSIVIDADE
  ========================== */
  @media (max-width: 1366px) {
    .sidebar_menu {
      padding: 12px 10px;
    }

    .sidebar_menu .menu-item,
    .sidebar_menu .menu ul li {
      min-height: 42px;
      padding: 9px 11px;
    }

    .sidebar_menu .menu-item span,
    .sidebar_menu .menu ul li span {
      font-size: 13px;
    }

    .menu-item.menu-painel-ouro::after {
      font-size: 9px;
      padding: 3px 7px;
    }

    .user-info {
      padding: 12px;
      gap: 12px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      min-width: 54px;
      font-size: 16px;
    }
  }

  @media (max-width: 1024px) {
    .sidebar_menu .logo a span {
      font-size: 16px;
    }

    .dado-label {
      min-width: 58px;
    }

    .dado-linha {
      font-size: 11px;
    }
  }

  @media (max-width: 768px) {
    .sidebar_menu {
      padding: 10px 8px;
    }

    .sidebar_menu .menu-item,
    .sidebar_menu .menu ul li {
      padding: 9px 10px;
      gap: 10px;
      border-radius: 10px;
    }

    .sidebar_menu .menu-item i,
    .sidebar_menu .menu ul li i {
      width: 16px;
      min-width: 16px;
      font-size: 14px;
    }

    .sidebar_menu .menu-item span,
    .sidebar_menu .menu ul li span {
      font-size: 12px;
    }

    .menu-item.menu-painel-ouro::after {
      display: none;
    }

    .user-info {
      padding: 11px;
      gap: 10px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 14px;
      font-size: 15px;
    }

    .dado-label {
      min-width: 54px;
    }

    .dado-linha {
      gap: 4px;
      font-size: 10.5px;
    }

    .btn-logout span {
      font-size: 12px;
    }
  }

  @media (min-width: 1600px) {
    .sidebar_menu {
      padding: 16px 14px;
    }

    .sidebar_menu .logo a {
      font-size: 19px;
    }

    .sidebar_menu .menu-item,
    .sidebar_menu .menu ul li {
      min-height: 46px;
    }

    .sidebar_menu .menu-item span,
    .sidebar_menu .menu ul li span {
      font-size: 14px;
    }

    .user-info {
      padding: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
    }

    .dado-linha {
      font-size: 12.5px;
    }
  }

  @media (min-width: 2200px) {
    .sidebar_menu {
      padding: 18px 16px;
    }

    .sidebar_menu .logo a {
      font-size: 20px;
    }

    .sidebar_menu .menu-item span,
    .sidebar_menu .menu ul li span {
      font-size: 15px;
    }
  }
</style>

<div class="main_box">
  <input type="checkbox" id="check" />

  <div class="sidebar_menu">
    <!-- ==========================
         🔷 LOGO
    =========================== -->
    <div class="logo">
      <a
        href="#"
        id="sidebarLogoLink"
      >
        <i class="fas fa-layer-group" style="color: #3f7bcc"></i>
        <span>OnePage Expert</span>
      </a>
    </div>

    <!-- ==========================
         📋 MENU PRINCIPAL
    =========================== -->
    <div class="menu">
      <ul id="menu-list">
        <!-- ANÁLISES -->
        <li
          class="menu-item"
          data-menu="analises"
        >
          <i class="fas fa-trophy icon-analises"></i>
          <span>Análises</span>
        </li>

        <!-- PAINEL DE OURO -->
        <li
          class="menu-item menu-painel-ouro"
          data-menu="painel-ouro"
        >
          <i class="fas fa-crown icon-painel-ouro"></i>
          <span>Painel de Ouro</span>
        </li>

        <!-- COMPARATIVOS -->
        <li
          class="menu-item"
          data-menu="comparativos"
        >
          <i class="fas fa-chart-pie icon-comparativos"></i>
          <span>Comparativos</span>
        </li>

        <!-- 🔥 CLASSES DINÂMICAS ENTRAM AQUI -->
      </ul>
    </div>

    <!-- ==========================
         🔻 RODAPÉ
    =========================== -->
    <div class="bottom-area">
      <!-- 👤 Perfil, Configurações e Sair ficam no menu do card de usuário
           no HEADER do topo (ver app/app-header.js). Aqui mantemos só o
           popover de dados pessoais/foto, acionado por esse menu. -->
      <div class="user-footer">
        <div class="perfil-popover" id="perfilPopover" hidden>
          <div class="perfil-pop-top">
            <div class="avatar avatar-pop" id="avatarPop"></div>
            <div class="perfil-pop-acoes">
              <button
                type="button"
                class="pop-btn"
                id="btnTrocarFoto"
              >
                <i class="fas fa-camera"></i> Trocar foto
              </button>
              <button
                type="button"
                class="pop-btn pop-btn-ghost"
                id="btnRemoverFoto"
                hidden
              >
                Remover
              </button>
              <input
                type="file"
                id="inputFotoPerfil"
                accept="image/*"
                hidden
              >
            </div>
          </div>
          <div class="perfil-pop-dados">
            <div class="pop-linha"><span>Nome</span><b id="popNome"></b></div>
            <div class="pop-linha"><span>Sobrenome</span><b id="popSobrenome"></b></div>
            <div class="pop-linha"><span>Matrícula</span><b id="popMatricula"></b></div>
            <div class="pop-linha"><span>Função</span><b id="popFuncao"></b></div>
            <div class="pop-linha"><span>E-mail</span><b id="popEmail"></b></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
