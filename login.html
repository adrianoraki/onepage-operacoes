<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePage Expert | Acesso ao Sistema</title>

    <link rel="icon" type="image/x-icon" href="assets/fave.png" />

    <link rel="stylesheet" href="css/login.css?v=20260727" />
  </head>
  <body>
    <!-- Sem formulário: login.html só existe como rede de segurança.
         A sessão é compartilhada com o StockFlow, então quem chega aqui
         já está autenticado — a tela de carregamento abaixo cobre o
         tempo de verificação antes do redirecionamento (ver app/login.js). -->
    <div class="login-overlay ativo" id="loginOverlay">
      <div class="overlay-content">
        <lottie-player
          id="overlayRing"
          src="assets/loading.json"
          background="transparent"
          speed="1"
          style="width:120px;height:120px;"
          loop
          autoplay
        ></lottie-player>
        <svg class="overlay-checkmark" id="overlayCheck" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle class="checkmark-circle" cx="26" cy="26" r="24" fill="none" stroke="#6ee79a" stroke-width="2.5"/>
          <path   class="checkmark-tick"   fill="none" stroke="#6ee79a" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round" d="M14 27 l8 8 l16 -16"/>
        </svg>
        <p class="overlay-texto" id="overlayTexto">Verificando acesso...</p>
      </div>
    </div>

    <!-- 🪵 LOGGER CENTRAL (primeiro, síncrono) -->
    <script src="app/logger.js"></script>

    <!-- Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- Supabase -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"
      defer
    ></script>
    <script src="app/login.js" defer></script>
  </body>
</html>
